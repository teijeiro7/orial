# PR Agent — Qodo PR-Agent sobre el combo pr-agent de OmniRoute
# Copiar a .github/workflows/pr-agent.yml en cada repo.
# Secret necesario en cada repo: OMNIROUTE_KEY (key de /root/.omniroute-pr-agent-key.txt).
# El puerto 20128 del gateway escucha en 0.0.0.0 (sin firewall) — runners de GitHub llegan directos.
name: PR Agent

on:
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: write

concurrency:
  group: ${{ github.repository }}-pr-agent
  cancel-in-progress: true

jobs:
  pr_agent:
    runs-on: ubuntu-latest
    if: ${{ github.event.sender.type != 'Bot' }}
    steps:
      - uses: qodo-ai/pr-agent@main
        env:
          OPENAI_KEY: ${{ secrets.OMNIROUTE_KEY }}
          OPENAI_BASE_URL: http://167.235.58.250:20128/v1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Automático en PR nuevo/actualizado: describe + review.
          # El resto (improve, /ask, /review) bajo demanda por comentario.
          PR_ACTIONS: '["describe", "review"]'
          CONFIG.MODEL: pr-agent
          CONFIG.MODEL_TURBO: pr-agent
          CONFIG.FALLBACK_MODELS: '["pr-agent"]'
          CONFIG.MAX_APPROVAL_COMMENTS: 1
          CONFIG.PR_DESCRIPTION.ENABLE_SEMANTIC_FILES: "true"
